name: Generate contribution animation

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/snake.yml"

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Generate Cyber-Pink contribution snake
        uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-contribution-grid-snake.svg?palette=github-dark&color_snake=%23ff5cad&color_dots=%2314071d,%235a1d42,%23b52f76,%23ff5cad,%23ffd0e8
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark&color_snake=%23ff5cad&color_dots=%2314071d,%235a1d42,%23b52f76,%23ff5cad,%23ffd0e8
      - name: Publish generated animation
        uses: crazy-max/ghaction-github-pages@v4
        with:
          build_dir: dist
        env:
          GH_PAT: ${{ secrets.GITHUB_TOKEN }}
